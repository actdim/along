name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'site-extra/**'
      - 'packages/dashboard-ui/**'
      - 'dashboard/**'
      - '.along/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'packages/dashboard-ui/pnpm-lock.yaml'

      - name: Build Dashboard UI
        run: |
          pnpm --prefix packages/dashboard-ui install --frozen-lockfile
          pnpm --prefix packages/dashboard-ui run build

      - name: Install MkDocs and plugins
        run: pip install mkdocs-material mkdocs-minify-plugin

      - name: Build site
        run: mkdocs build

      - name: Export Dashboard static bundle
        run: python scripts/along_dash.py --export site/dashboard

      - name: Copy extra static files
        run: |
          cp llms.txt site/llms.txt
          cp llms-full.txt site/llms-full.txt
          cp -r site-extra/. site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
