[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "actdim-along"
version = "2.2.8"
description = "Provider-agnostic agent-context protocol and skills suite: in-repo memory, entity lifecycle, and LLM-Wiki knowledge base for Claude Code, Codex, OpenCode, and Antigravity."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "actdim" }]
keywords = ["along", "ai-agent", "llms", "rules", "agents", "protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Documentation",
]

# Runtime dependency of the engines. `alongkit.bootstrap.RUNTIME_DEPENDENCIES` mirrors
# this list for the direct-invocation path (`python scripts/along_exec.py` with no
# environment prepared) and a test asserts the two stay identical.
dependencies = [
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
# The dashboard is a separate surface: a consumer that only needs the entity lifecycle
# and the knowledge base must not pay for a web stack.
dash = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[dependency-groups]
# Installed by `uv run` and `uv sync` by default, so the test suite has the dashboard
# stack available: tests/test_skills_and_scripts.py exercises the collector and graph.
dev = [
    "actdim-along[dash]",
]

[project.scripts]
# Canonical entry point. Skills currently document `python scripts/<engine>.py`, which
# does not exist in a consumer repository; rewriting them onto this command is tracked
# as `[bug--skill-commands-reference-missing-script-paths]`.
along = "alongkit.cli:main"

[project.urls]
Homepage = "https://github.com/actdim/along"
Repository = "https://github.com/actdim/along"

[tool.hatch.build.targets.wheel]
# The package lives next to the engines it serves, so a flat directory copy into
# `~/.along/bin/` carries both and `from alongkit import ...` resolves with no
# `sys.path` manipulation.
packages = ["scripts/alongkit"]

[tool.hatch.build.targets.wheel.force-include]
# The engines ship as data files inside the package, so the console script can resolve
# them after an install that has no `scripts/` directory on disk. Listed one by one
# rather than as a directory, which would nest a second copy of `alongkit` itself;
# `test_engine_manifest_matches_scripts_dir` asserts this list stays complete.
"scripts/along_commit.py" = "alongkit/engines/along_commit.py"
"scripts/along_dash.py" = "alongkit/engines/along_dash.py"
"scripts/along_dep_scan.py" = "alongkit/engines/along_dep_scan.py"
"scripts/along_exec.py" = "alongkit/engines/along_exec.py"
"scripts/along_feedback.py" = "alongkit/engines/along_feedback.py"
"scripts/along_history_sync.py" = "alongkit/engines/along_history_sync.py"
"scripts/along_kb_search.py" = "alongkit/engines/along_kb_search.py"
"scripts/along_kb_sync.py" = "alongkit/engines/along_kb_sync.py"
"scripts/along_update.py" = "alongkit/engines/along_update.py"
"scripts/along_version_bump.py" = "alongkit/engines/along_version_bump.py"
"scripts/migrate_protocol.py" = "alongkit/engines/migrate_protocol.py"
"scripts/sanitize_typography.py" = "alongkit/engines/sanitize_typography.py"

[tool.hatch.build.targets.sdist]
include = [
    "scripts",
    "skills",
    "rules",
    "docs",
    "config",
    "AGENTS.md",
    "README.md",
    "llms.txt",
    "llms-full.txt",
    "install.ps1",
    "install.sh",
    "install.bat",
    "tests",
]
