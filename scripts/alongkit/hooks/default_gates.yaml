# Central Declarative Gate Catalogue for Along Protocol
# Governed by alongkit.hooks.declarative and verified via [gate: <id>] anchors.
version: 1

gates:
  - id: commit_issue_binding
    enforcement: [runtime, git, ci]
    title: "Git Commit Issue Slug Binding"
    description: "Enforces issue slug binding ([type--slug] or /along-commit's (refs #slug)) in commit messages"
    event: PreToolUse
    tools: [run_command, execute_command, bash, shell]
    match_args:
      CommandLine: '^git\s+commit'
    rule:
      type: regex_match
      field: CommandLine
      pattern: '\[[a-z]+--[a-z0-9-]+\]|\(refs #[a-z0-9-]+\)'
      error: "Git commit rejected by [gate: commit-issue-binding]: Commit message must bind an issue slug, '[feat--my-feature]' or '(refs #my-feature)'. Use /along-commit."

  - id: commit_no_conflict_markers
    enforcement: [runtime, git, ci]
    title: "Git Commit Merge Conflict Protection"
    description: "Blocks commits whose staged content adds unresolved git conflict markers"
    event: PreToolUse
    tools: [run_command, execute_command, bash, shell]
    match_args:
      CommandLine: '^git\s+commit'
    rule:
      type: predicate
      handler: alongkit.hooks.predicates.check_staged_conflict_markers
      error: "Git commit rejected by [gate: commit-no-conflict-markers]: Unresolved git merge conflict markers detected in staged content."

  - id: commit_no_ai_coauthor
    enforcement: [runtime, git, ci]
    title: "Git Commit AI Co-Author Protection"
    description: "Blocks commits whose message names an AI agent in a Co-Authored-By trailer"
    event: PreToolUse
    tools: [run_command, execute_command, bash, shell]
    match_args:
      CommandLine: '\bgit\s+(?:-C\s+\S+\s+)?commit\b'
    rule:
      type: predicate
      handler: alongkit.hooks.predicates.check_ai_coauthor
      error: "Git commit rejected by [gate: commit-no-ai-coauthor]: AI co-author trailer in commit message."

  - id: anti_stub_injection
    enforcement: [runtime, git, ci]
    title: "Anti-Stub Truncation Protection"
    description: "Blocks lazy truncation skeletons and placeholder comments"
    event: PreToolUse
    tools: [write_to_file, write_file, replace_file_content, edit_file, patch_file, create_file]
    rule:
      type: regex_forbidden
      field: [CodeContent, ReplacementContent, content]
      pattern: '(?i)(//\s*\.\.\.\s*(rest|existing|code|here)|#\s*\.\.\.\s*(rest|existing|code|here)|<!--\s*\.\.\.\s*(rest|existing|code|here)|/\*\s*\.\.\.\s*(rest|existing|code|here)\s*\*/)'
      error: "Write rejected by [gate: anti-stub-injection]: Truncation placeholder or code skeleton stub detected. Supply complete implementation."

  - id: cli_safety
    title: "Destructive Shell Command Protection"
    description: "Blocks destructive shell commands, heredocs, and inline writers"
    event: PreToolUse
    tools: [run_command, execute_command, bash, shell]
    rule:
      type: predicate
      handler: alongkit.hooks.predicates.check_cli_safety
      error: "CLI Safety Gate Violation [gate: cli-safety]."

  - id: projection_protection
    enforcement: [runtime, git, ci]
    title: "Projection View Protection"
    description: "Blocks direct edits to compiled projections (.along/ISSUES.md, docs/INDEX.md)"
    event: PreToolUse
    tools: [write_to_file, write_file, replace_file_content, edit_file, patch_file, create_file]
    rule:
      type: predicate
      handler: alongkit.hooks.predicates.check_projection_protection
      error: "Manual edit to compiled projection rejected by [gate: projection-protection]."

  - id: rule_pack_protection
    # runtime: file tools and shell commands that write .along/rules/**/*.md (`along rules ...`
    # excepted). git / ci: alongkit.gitgates.check_rule_packs - a staged or tracked rule pack
    # carries the managed header and its body matches the header hash.
    enforcement: [runtime, git, ci]
    title: "Managed Rule Pack Protection"
    description: "Blocks agent edits to managed rule packs (.along/rules/**/*.md); gates.yaml stays editable"
    event: PreToolUse
    tools: [write_to_file, write_file, replace_file_content, edit_file, patch_file, create_file, run_command, execute_command, bash, shell]
    rule:
      type: predicate
      handler: alongkit.hooks.predicates.check_rule_pack_protection
      error: "Edit to a managed rule pack rejected by [gate: rule-pack-protection]."

  - id: doc_manual_lock
    title: "Manual Document Lock Protection"
    description: "Blocks automated agent edits to documentation marked with write_policy: manual"
    event: PreToolUse
    tools: [write_to_file, write_file, replace_file_content, edit_file, patch_file]
    rule:
      type: predicate
      handler: alongkit.hooks.predicates.check_doc_manual_lock
      error: "Manual Document Lock Violation [gate: doc-manual-lock]."

  - id: typography
    enforcement: [runtime, git, ci]
    title: "Clean ASCII Typography"
    description: "Enforces clean ASCII characters and bans non-ASCII dashes, quotes, ellipsis, and invisible spaces"
    event: PreToolUse
    tools: [write_to_file, write_file, replace_file_content, edit_file, patch_file, create_file]
    rule:
      type: predicate
      handler: alongkit.hooks.predicates.check_typography
      error: "Typography violation detected by [gate: clean-ascii-typography]."

  - id: require_active_issue
    title: "Mandatory Issue Anchoring"
    description: "Blocks modifying repository source code without an in-progress issue"
    event: PreToolUse
    tools: [write_to_file, write_file, replace_file_content, edit_file, patch_file, create_file]
    rule:
      type: predicate
      handler: alongkit.hooks.predicates.check_active_issue
      exclude_paths:
        - '.along/ISSUES/**'
        - '.along/.session/**'
        - '.along/diagnostics/**'
        - '.along/SESSIONS/**'
        - '.along/DECISIONS/**'
        - '.along/MILESTONES/**'
        - '.along/RISKS/**'
        - '.along/SPIKES/**'
        - '.along/CHECKLISTS/**'
        - '.along/*.md'
        - '.along/HISTORY.md'
        - 'docs/**'
        - 'CHANGELOG.md'
      error: "Code edit rejected by [gate: require-active-issue]: Modifying repository source code requires an active issue with 'status: in-progress' in .along/ISSUES/. Create an issue first."

  - id: team_step_active
    title: "along-team Step Discipline"
    description: "Blocks source edits in a role-based (along-team) session while no step is in progress"
    event: PreToolUse
    tools: [write_to_file, write_file, replace_file_content, edit_file, patch_file, create_file]
    rule:
      type: predicate
      handler: alongkit.hooks.predicates.check_team_step_active
      error: "Code edit rejected by [gate: team-step-active]: start an along-team step first."

  - id: team_reviews_before_stop
    title: "along-team Reviews Before Turn Termination"
    description: "Blocks turn completion while a passed along-team step has no reviews/step-N.md"
    event: Stop
    rule:
      type: predicate
      handler: alongkit.hooks.predicates.check_team_reviews_before_stop
      error: "Turn completion rejected by [gate: team-reviews-before-stop]: write the step review first."

  - id: test_before_stop
    title: "Test Execution Before Turn Termination"
    description: "Blocks turn completion if source code was changed without running tests"
    event: Stop
    # Sessions not bound to an issue ('along start <slug>') are not held unless a repository
    # sets enforce_unbound: true in .along/rules/gates.yaml.
    enforce_unbound: false
    rule:
      type: predicate
      handler: alongkit.hooks.predicates.check_test_before_stop
      error: "Turn completion rejected by [gate: test-before-stop]: Source files were modified, but automated tests have not been executed afterward. Run tests via '/along-test' or 'python .along/scripts/test.py'."

  - id: wrap_before_stop
    title: "Session Wrap Before Turn Termination"
    description: "Blocks turn completion if an issue was marked done without recording a session log"
    event: Stop
    rule:
      type: predicate
      handler: alongkit.hooks.predicates.check_wrap_before_stop
      error: "Turn completion rejected by [gate: wrap-before-stop]: An issue was completed or moved to 'done/', but no session log exists in '.along/SESSIONS/' for today. Run '/along-wrap' before ending."

  - id: projection_sync_before_stop
    title: "Projection Synchronization Before Turn Termination"
    description: "Blocks turn completion if atomic issues or docs changed without projection recompilation"
    event: Stop
    rule:
      type: predicate
      handler: alongkit.hooks.predicates.check_projection_sync_before_stop
      error: "Turn completion rejected by [gate: projection-sync-before-stop]: Atomic issues or docs were modified without recompiling projections. Run 'along issue sync' or 'along kb sync'."

  - id: entity_reference_integrity
    # runtime: Stop once entity files changed; also run by `along wrap` and
    # `along issue sync` (alongkit.gates.entity_integrity_gate). git / ci: `along gates
    # check` and `along commit` block references the staged or pushed change newly breaks.
    enforcement: [runtime, git, ci]
    title: "Entity Reference Integrity"
    description: "Entity graph has no dangling references (related, blocked_by, parent, superseded_by, duplicate_of, milestone, target_issues) and no schema or enum violations"
    event: Stop
    rule:
      type: predicate
      handler: alongkit.hooks.predicates.check_entity_reference_integrity
      error: "Turn completion rejected by [gate: entity-reference-integrity]: The entity graph has dangling references or schema violations. Run 'along doctor --entities'; use 'along issue rename' / 'along issue supersede' instead of deleting referenced entities."

  - id: subproject_boundary
    title: "Subproject Localization Boundary"
    description: "Blocks creating .along entities at workspace root when working inside subproject"
    event: PreToolUse
    tools: [write_to_file, write_file, replace_file_content, edit_file, patch_file, create_file]
    rule:
      type: predicate
      handler: alongkit.hooks.predicates.check_subproject_boundary
      error: "Subproject boundary violation detected by [gate: subproject-boundary]: Entities must be localized in the nearest subproject .along/ directory, not root."

  - id: workspace_containment
    title: "Workspace Containment"
    description: "Keeps file, search and shell-cwd paths inside the workspace; writes outside are denied, reads outside undeclared roots ask (interactive) or are denied (autonomous)"
    event: PreToolUse
    tools: [write_to_file, write_file, replace_file_content, edit_file, patch_file, create_file, view_file, read_file, view_image, list_dir, list_directory, grep_search, grep, find_by_name, find_files, file_search, run_command, execute_command, bash, shell]
    # Options (overridable in .along/rules/gates.yaml): allowed_roots, write_scope,
    # on_violation (auto | ask | deny). See alongkit.hooks.containment.
    allowed_roots: []
    write_scope: []
    on_violation: auto
    rule:
      type: predicate
      handler: alongkit.hooks.predicates.check_workspace_containment
      error: "Workspace containment violation detected by [gate: workspace-containment]."

  # Repository-state gates (alongkit.repochecks): no runtime layer, run by
  # `along gates check` (pre-commit on staged files, --ci on every tracked file).
  # Options: exclude_paths (fnmatch globs); stable_entry_point also takes scope.
  - id: windows_safe_filenames
    enforcement: [git, ci]
    title: "Windows-Safe Filenames"
    description: "Tracked paths carry no Windows-forbidden characters, trailing dots/spaces or reserved device names"
    rule:
      type: predicate
      handler: alongkit.repochecks.check_windows_safe_filenames
      error: "Filename rejected by [gate: windows-safe-filenames]."

  - id: untracked_exports
    enforcement: [git, ci]
    title: "Untracked Dashboard Exports"
    description: ".along/dashboard.html and .along/DASHBOARD.md are local exports and never tracked"
    rule:
      type: predicate
      handler: alongkit.repochecks.check_untracked_exports
      error: "Tracked export rejected by [gate: untracked-exports]."

  - id: code_fence_language
    enforcement: [git, ci]
    title: "Explicit Code Fence Languages"
    description: "Every opening Markdown code fence names a language"
    exclude_paths: ["node_modules/*", "*/node_modules/*"]
    rule:
      type: predicate
      handler: alongkit.repochecks.check_code_fence_language
      error: "Markdown rejected by [gate: code-fence-language]."

  - id: portable_links
    enforcement: [git, ci]
    title: "Portable Markdown Links"
    description: "Markdown link targets use relative paths: no file:// scheme, no backslashes"
    rule:
      type: predicate
      handler: alongkit.repochecks.check_portable_links
      error: "Link rejected by [gate: portable-links]."

  - id: stable_entry_point
    enforcement: [git, ci]
    title: "Stable Entry Point"
    description: "README.md and docs/ never link into .along/; route through docs/INDEX.md or docs/topic--*.md"
    scope: ["README.md", "docs/*"]
    rule:
      type: predicate
      handler: alongkit.repochecks.check_stable_entry_point
      error: "Link rejected by [gate: stable-entry-point]."

  - id: issue_lifecycle
    enforcement: [git, ci]
    title: "Issue Lifecycle Placement"
    description: "Closed issues (done, cancelled, superseded) live in .along/ISSUES/done/; open ones never do"
    rule:
      type: predicate
      handler: alongkit.repochecks.check_issue_lifecycle
      error: "Issue placement rejected by [gate: issue-lifecycle]."

  - id: session_record_append_only
    # git / ci only, base-aware: `along gates check`, `along commit` and CI compare each changed
    # session log with HEAD (or the range base) via alongkit.gitgates.check_session_records.
    enforcement: [git, ci]
    title: "Session Record Append-Only"
    description: "A committed session log never loses lines of its Blackboard Record; the Summary stays editable"
    rule:
      type: predicate
      handler: alongkit.gitgates.check_session_records
      error: "Session log rejected by [gate: session-record-append-only]."

  - id: no_tracked_secrets
    enforcement: [git, ci]
    title: "No Secrets In Tracked Files"
    description: "Tracked content carries no private keys or well-known API token shapes"
    rule:
      type: predicate
      handler: alongkit.repochecks.check_no_tracked_secrets
      error: "Content rejected by [gate: no-tracked-secrets]."

  - id: worktree_env_readiness
    title: "Worktree Environment Readiness"
    description: "Blocks execution in bare worktrees lacking linked dependencies or configuration"
    event: PreToolUse
    tools: [write_to_file, write_file, replace_file_content, edit_file, patch_file, create_file, run_command, execute_command, bash, shell]
    rule:
      type: predicate
      handler: alongkit.hooks.predicates.check_worktree_env_readiness
      error: "Worktree environment readiness violation detected by [gate: worktree-env-readiness]."

  - id: circuit_breaker
    title: "Systemic Anomaly Circuit Breaker"
    description: "Blocks modifying tools and shell commands when the circuit breaker is tripped"
    event: PreToolUse
    tools: [write_to_file, write_file, replace_file_content, edit_file, patch_file, create_file, run_command, execute_command, bash, shell]
    rule:
      type: predicate
      handler: alongkit.hooks.predicates.check_circuit_breaker
      error: "Tool execution rejected by [gate: circuit-breaker]: The systemic anomaly circuit breaker is TRIPPED."

  - id: require_plan_approval
    title: "Inquiry Read-Only Mode & Plan Approval Enforcement"
    description: "Blocks modifying repository files and executing state-mutating commands in inquiry phase without an approved plan"
    event: PreToolUse
    tools: [write_to_file, write_file, replace_file_content, edit_file, patch_file, create_file, run_command, execute_command, bash, shell]
    # Read-only and verification commands (build, test, lint, typecheck) always pass. Sessions
    # not bound to an issue are not held unless enforce_unbound: true (.along/rules/gates.yaml).
    enforce_unbound: false
    rule:
      type: predicate
      handler: alongkit.hooks.predicates.check_mutation_authorization
      error: "Mutation rejected by [gate: require-plan-approval]: Plan approval required before repository mutations."

  - id: fast_retrieval
    title: "Fast Knowledge Base & Memory Retrieval"
    description: "Blocks manual directory search across docs/ and .along/ directories, enforcing along kb-search"
    event: PreToolUse
    tools: [grep_search, grep, find_by_name, find_files, file_search]
    rule:
      type: predicate
      handler: alongkit.hooks.predicates.check_fast_retrieval
      error: "Manual directory search across docs/ or .along/ rejected by [gate: fast-retrieval]."



