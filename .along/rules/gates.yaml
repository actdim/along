# Repository overrides of the built-in gate catalogue (alongkit/hooks/default_gates.yaml).
# Repo-owned: `along rules attach` never rewrites this file.
version: 1

gates:
  # AGENTS.md requires an approved plan before source edits and a test run before a turn
  # ends; hold sessions to that even before they are bound to an issue.
  - id: require_plan_approval
    enforce_unbound: true

  # The suite tests Markdown too (protocol and AGENTS.md budgets, skill manifests), so a
  # documentation edit needs a test run here as well.
  - id: test_before_stop
    enforce_unbound: true
    count_docs: true
    doc_tests:
      - test_context_budget.py
      - test_sanitizer.py
      - test_kb_sync.py
      - test_kb_search.py
      - test_skills_and_scripts.py
